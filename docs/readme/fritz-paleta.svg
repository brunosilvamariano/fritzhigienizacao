<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Paleta visual da Fritz</title><desc id="desc">Sete cores: azul Fritz, azul da marca, azul profundo, névoa, branco suave, areia e âmbar.</desc><rect width="1120" height="300" rx="24" fill="#f7fafc"/><text x="36" y="49" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#395368">IDENTIDADE VISUAL</text><text x="36" y="88" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#102e4a">Azul que transmite cuidado. Tons que acolhem.</text><rect x="36" y="116" width="139" height="99" rx="12" fill="#175DA8" stroke="#d0dfeb"/><text x="36" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Azul Fritz</text><text x="36" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#175DA8</text><rect x="187" y="116" width="139" height="99" rx="12" fill="#143874" stroke="#d0dfeb"/><text x="187" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Azul da marca</text><text x="187" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#143874</text><rect x="338" y="116" width="139" height="99" rx="12" fill="#102E4A" stroke="#d0dfeb"/><text x="338" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Azul profundo</text><text x="338" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#102E4A</text><rect x="489" y="116" width="139" height="99" rx="12" fill="#E3EFF9" stroke="#d0dfeb"/><text x="489" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Névoa</text><text x="489" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#E3EFF9</text><rect x="640" y="116" width="139" height="99" rx="12" fill="#F7FAFC" stroke="#d0dfeb"/><text x="640" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Branco suave</text><text x="640" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#F7FAFC</text><rect x="791" y="116" width="139" height="99" rx="12" fill="#EDE3D8" stroke="#d0dfeb"/><text x="791" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Areia</text><text x="791" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#EDE3D8</text><rect x="942" y="116" width="139" height="99" rx="12" fill="#F3B75B" stroke="#d0dfeb"/><text x="942" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#102e4a">Âmbar</text><text x="942" y="265" font-family="Arial,sans-serif" font-size="12" fill="#395368">#F3B75B</text></svg>