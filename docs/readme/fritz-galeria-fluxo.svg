02 · Abre e acompanha o scroll</text><text x="922" y="222" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">03 · Fora da área de ativação</text><text x="922" y="250" text-anchor="middle" fill="#c4d4e4" font-family="Arial,sans-serif" font-size="13">Volta à pilha, sem fechamento animado.</text></svg>