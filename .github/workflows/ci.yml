name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:tracking
      - run: npm audit
      - run: npm run build
